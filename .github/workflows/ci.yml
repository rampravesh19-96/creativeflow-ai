name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [apps/web, apps/api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creativeflow_test
          POSTGRES_USER: creativeflow
          POSTGRES_PASSWORD: creativeflow_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U creativeflow" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ matrix.app }}/package-lock.json' }
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run lint
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
      - run: npm run typecheck && npm run test && npm run format:check
        working-directory: ${{ matrix.app }}
        env:
          TEST_DATABASE_URL: postgresql://creativeflow:creativeflow_test_only@localhost:5432/creativeflow_test
          AI_PROVIDER_MODE: mock
